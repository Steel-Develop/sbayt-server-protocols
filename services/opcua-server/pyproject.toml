[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbayt-opcua-server"
version = "0.1.0"
description = "Configurable OPC UA server for external signal writers"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["asyncua==2.1.0"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "mypy==1.20.2",
    "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sbayt_opcua_server"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: local OPC UA client/server tests"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
