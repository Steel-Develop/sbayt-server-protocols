[project]
name = "sbayt-server-protocols"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.4"]
opcua = ["asyncua==2.1.0", "pytest-asyncio==1.4.0"]
# MQTT tests use the clients included in the broker image.
mqtt = []

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
