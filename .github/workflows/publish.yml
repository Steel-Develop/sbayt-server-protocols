name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.release.outputs.version }}
      services: ${{ steps.release.outputs.services }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/master
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "services=$(jq -c . services.json)" >> "$GITHUB_OUTPUT"

  checks:
    needs: release
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [release, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.release.outputs.services) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.service.image }}:${{ needs.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/Steel-Develop/sbayt-server-protocols
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}-release
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}-release

  verify:
    needs: [release, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.release.outputs.services) }}
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.11.29
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Pull public image and verify manifest
        env:
          SERVER_IMAGE: ${{ matrix.service.image }}:${{ needs.release.outputs.version }}
          SERVER_PLATFORM: ${{ matrix.platform }}
        run: |
          docker pull --platform "$SERVER_PLATFORM" "$SERVER_IMAGE"
          docker buildx imagetools inspect --raw "$SERVER_IMAGE" | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | contains(["amd64", "arm64"])'
      - name: Test published protocol and health without registry credentials
        env:
          SERVER_PROTOCOL: ${{ matrix.service.name }}
          SERVER_IMAGE: ${{ matrix.service.image }}:${{ needs.release.outputs.version }}
          SERVER_PLATFORM: ${{ matrix.platform }}
        run: uv run --locked --group "$SERVER_PROTOCOL" pytest "tests/test_${SERVER_PROTOCOL}.py" -q

  latest:
    needs: [release, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote verified version manifests
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          while IFS= read -r image; do
            docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
          done < <(jq -r '.[].image' services.json)
